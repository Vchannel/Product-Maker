<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đang import...</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; background: #fafafa; }
  h1 { font-size: 20px; }
  .urls { color: #666; font-size: 13px; margin-bottom: 16px; }
  #log { background: #1e1e1e; color: #d4d4d4; font-family: monospace; font-size: 13px; padding: 14px; border-radius: 8px; height: 420px; overflow-y: auto; white-space: pre-wrap; }
  .status { margin-top: 16px; padding: 12px 14px; border-radius: 6px; font-size: 14px; display: none; }
  .status.done { background: #d4edda; border: 1px solid #a8d9b5; display: block; }
  .status.error { background: #fde2e2; border: 1px solid #f3aaaa; display: block; }
  .status a { color: #155724; font-weight: 600; }
  a.back { display: inline-block; margin-top: 20px; color: #2271b1; text-decoration: none; }
</style>
</head>
<body>
  <h1>Đang import...</h1>
  <div class="urls">{{ urls|join('<br>')|safe }}</div>
  <div id="log">Đang khởi động...</div>
  <div id="status" class="status"></div>
  <a class="back" href="/">← Import sản phẩm khác</a>

<script>
const jobId = {{ job_id|tojson }};
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');

async function poll() {
  const res = await fetch(`/api/job/${jobId}`);
  const data = await res.json();
  logEl.textContent = data.logs.join('\n') || 'Đang khởi động...';
  logEl.scrollTop = logEl.scrollHeight;

  if (data.done) {
    if (data.error) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Lỗi: ' + data.error + ' — chạy lại từ trang chủ với cùng URL để tiếp tục từ bước đã cache thành công.';
    } else if (data.result) {
      statusEl.className = 'status done';
      statusEl.innerHTML = 'Hoàn tất! <a href="' + data.result + '" target="_blank">' + data.result + '</a>';
    }
    return;
  }
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
